server {
    listen 80;
    server_name qayuoomhamid.cyborgtech.co;
    root /www/wwwroot/qayuoomhamid.cyborgtech.co;
    index index.php index.html;

    location /qayuoomhamid.cyborgtech.co {
        try_files $uri $uri/ /qayuoomhamid.cyborgtech.co/index.php?/$request_uri;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}
